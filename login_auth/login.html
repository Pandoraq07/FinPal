<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinPal — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --indigo: #4F46E5;
      --violet: #7C3AED;
      --text: #0F0F1A;
      --muted: #6B7280;
      --border: #E5E7EB;
      --input-bg: #F9FAFB;
      --error: #EF4444;
    }
    html, body { height: 100%; font-family: 'Inter', sans-serif; background: #fff; }
    .page { display: grid; grid-template-columns: 1fr 1fr; min-height: 100vh; }
    .panel-image { position: relative; overflow: hidden; }
    .panel-image img { width: 100%; height: 100%; object-fit: cover; object-position: center; display: block; }
    .panel-image-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(79,70,229,0.15) 0%, rgba(124,58,237,0.08) 100%);
      pointer-events: none;
    }
    .panel-brand { position: absolute; top: 36px; left: 36px; display: flex; align-items: center; gap: 10px; z-index: 2; }
    .logo-mark {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, var(--indigo), var(--violet));
      border-radius: 10px; display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 800; font-size: 18px;
      box-shadow: 0 4px 16px rgba(79,70,229,0.4);
    }
    .logo-name { color: #fff; font-weight: 700; font-size: 20px; text-shadow: 0 1px 8px rgba(0,0,0,0.3); }
    .panel-tagline { position: absolute; bottom: 40px; left: 36px; right: 36px; z-index: 2; }
    .panel-tagline h2 { color: #fff; font-size: 28px; font-weight: 800; line-height: 1.25; text-shadow: 0 2px 16px rgba(0,0,0,0.4); margin-bottom: 8px; }
    .panel-tagline p { color: rgba(255,255,255,0.85); font-size: 14px; font-weight: 500; text-shadow: 0 1px 8px rgba(0,0,0,0.3); }
    .panel-form { display: flex; align-items: center; justify-content: center; padding: 60px 48px; background: #fff; }
    .form-inner { width: 100%; max-width: 400px; }
    .slide-in { opacity: 0; transform: translateX(32px); animation: slideIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    @keyframes slideIn { to { opacity: 1; transform: translateX(0); } }
    .slide-in:nth-child(1) { animation-delay: 0.05s; }
    .slide-in:nth-child(2) { animation-delay: 0.12s; }
    .slide-in:nth-child(3) { animation-delay: 0.19s; }
    .slide-in:nth-child(4) { animation-delay: 0.26s; }
    .slide-in:nth-child(5) { animation-delay: 0.33s; }
    .slide-in:nth-child(6) { animation-delay: 0.40s; }
    .form-eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; color: var(--indigo); text-transform: uppercase; margin-bottom: 12px; }
    .form-title { font-size: 32px; font-weight: 800; color: var(--text); line-height: 1.15; margin-bottom: 6px; }
    .form-sub { font-size: 14px; color: var(--muted); margin-bottom: 36px; }
    .input-group { margin-bottom: 20px; }
    .input-label { display: block; font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 7px; }
    .auth-input {
      width: 100%; padding: 13px 16px;
      background: var(--input-bg); border: 1.5px solid var(--border);
      border-radius: 10px; font-size: 14px; font-family: 'Inter', sans-serif;
      color: var(--text); transition: border-color 0.2s, box-shadow 0.2s; outline: none;
    }
    .auth-input:focus { border-color: var(--indigo); background: #fff; box-shadow: 0 0 0 3px rgba(79,70,229,0.12); }
    .auth-input::placeholder { color: #B0B7C3; }
    .forgot-link { display: block; text-align: right; font-size: 12px; font-weight: 500; color: var(--indigo); text-decoration: none; margin-top: 6px; }
    .forgot-link:hover { text-decoration: underline; }
    .error-msg { font-size: 13px; color: var(--error); min-height: 18px; margin-bottom: 4px; }
    .auth-btn {
      width: 100%; padding: 14px;
      background: linear-gradient(135deg, var(--indigo), var(--violet));
      color: #fff; border: none; border-radius: 10px;
      font-size: 15px; font-weight: 700; font-family: 'Inter', sans-serif;
      cursor: pointer; margin-top: 8px;
      transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 4px 20px rgba(79,70,229,0.35);
    }
    .auth-btn:hover { opacity: 0.93; transform: translateY(-1px); box-shadow: 0 8px 28px rgba(79,70,229,0.4); }
    .auth-btn:active { transform: translateY(0); }
    .auth-btn.loading { opacity: 0.7; pointer-events: none; }
    .auth-switch { text-align: center; font-size: 13px; color: var(--muted); margin-top: 24px; }
    .auth-switch a { color: var(--indigo); font-weight: 600; text-decoration: none; }
    .auth-switch a:hover { text-decoration: underline; }
    @media (max-width: 768px) {
      .page { grid-template-columns: 1fr; }
      .panel-image { display: none; }
      .panel-form { padding: 48px 24px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .slide-in { animation: none; opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="panel-image">
      <img src="../images/Login-2.jpg" alt="Finance background">
      <div class="panel-image-overlay"></div>
      <div class="panel-brand">
        <div class="logo-mark">F</div>
        <span class="logo-name">FinPal</span>
      </div>
      <div class="panel-tagline">
        <h2>Track your spending.<br>Own your future.</h2>
        <p>Smart personal finance for everyday people.</p>
      </div>
    </div>

    <div class="panel-form">
      <div class="form-inner">
        <p class="form-eyebrow slide-in">Welcome back</p>
        <h1 class="form-title slide-in">Sign in to<br>your account</h1>
        <p class="form-sub slide-in">Enter your credentials to continue</p>

        <form id="loginForm">
          <div class="input-group slide-in">
            <label class="input-label" for="email">Email</label>
            <input class="auth-input" type="email" id="email" placeholder="you@example.com" required autocomplete="email">
          </div>
          <div class="input-group slide-in">
            <label class="input-label" for="password">Password</label>
            <input class="auth-input" type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
            <a href="#" class="forgot-link">Forgot password?</a>
          </div>
          <p class="error-msg slide-in" id="errorMsg"></p>
          <button class="auth-btn slide-in" type="submit">Sign in</button>
        </form>

        <p class="auth-switch slide-in">
          Don't have an account? <a href="register.html">Create one</a>
        </p>
      </div>
    </div>
  </div>

  <script src="auth.js"></script>
  <script>
    const form = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');

    form.addEventListener('submit', async function(e) {
      e.preventDefault();
      errorMsg.textContent = '';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const btn = form.querySelector('.auth-btn');

      btn.classList.add('loading');
      btn.textContent = 'Signing in…';

      const result = await loginUser(email, password);

      if (!result.success) {
        errorMsg.textContent = result.message;
        btn.classList.remove('loading');
        btn.textContent = 'Sign in';
        return;
      }

      window.location.href = '../finance-app/index.html';
    });
  </script>
</body>
</html>
